name: Update catalog and deploy Pages

'on':
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1,4'
      timezone: Asia/Tokyo
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Update catalog
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: npm run update
      - name: Commit validated catalog
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git add public/gyms.json data/geocode-cache.json
          if git diff --cached --quiet; then
            echo 'Catalog is unchanged'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'data: update gym catalog'
            git push
          fi
      - run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
